syntax = "proto2";

option java_multiple_files = true;

package unknow.server.bench.protostuff;

message TestMsg {
	optional string test = 1;
	optional uint32 v = 2;
	repeated TestMsg loop = 3;
}


message AnotherMessage {
  required int32 id = 1;
  option foo = "bar";
}

message AMessage {
  option message_set_wire_format = true;

  required AnotherMessage anotherMessage = 1 [anOption = "something"];
}

enum Baz {
  option random.enum.option = 1.0;
  
  A = 1 [some_int = 1, some_bool = true, some_string = "foo", default = "none"];
  Z = 26;
  
}
